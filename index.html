<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oriva Apps</title>
<meta name="description" content="Oriva Apps makes simple, private apps that work offline.">
<style>
  :root { --bg: #FBF7EE; --ink: #1C2420; --muted: #6E746F; --accent: #0F5C47; --line: #EADFC8; --card: #FFFDF7; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 16px 56px; }
  h1 { color: var(--accent); font-size: 32px; margin: 0 0 4px; }
  .tagline { color: var(--muted); margin: 0 0 36px; }
  h2 { font-size: 19px; margin: 0 0 12px; }
  .app { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px 20px; margin-bottom: 14px; }
  .app h3 { margin: 0 0 4px; font-size: 18px; }
  .app p { margin: 0 0 8px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 40px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1>Oriva Apps</h1>
  <p class="tagline">Simple, private apps that work offline.</p>

  <h2>Apps</h2>
  <div class="app">
    <h3>Naat Companion</h3>
    <p>585 naat, salaam and manqabat in Urdu, Hindi and Roman, with stage mode for the mehfil. Coming soon to Google Play.</p>
    <a href="naat-companion/privacy/">Privacy policy</a>
  </div>

  <footer>Contact: <a href="mailto:orivaapps@gmail.com">orivaapps@gmail.com</a></footer>
</main>
</body>
</html>
